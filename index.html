<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Saira:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0d10; --panel:#15171d; --panel2:#1c1f27; --line:#ffffff12;
    --text:#f2f0ea; --muted:#8a8f9a; --dim:#5b606b;
    --accent:#ff5a1f; --lime:#c6ff3a; --red:#ff3b46; --blue:#41c7f7;
    --grid:#ffffff07;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:26px 26px;
    color:var(--text); font-family:'Saira',system-ui,sans-serif; font-size:16px; line-height:1.3;
    padding-bottom:120px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:680px; margin:0 auto; padding:0 14px;}

  header{position:sticky; top:0; z-index:30; background:linear-gradient(180deg,#0c0d10 70%,#0c0d10cc 100%); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:10px 0 8px;}
  .brandrow{display:flex; align-items:center; gap:10px; padding:0 14px; max-width:680px; margin:0 auto;}
  .brand{font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:2px; line-height:1;}
  .brand .dot{color:var(--accent);}
  .brandsub{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin-left:auto; max-width:60%; text-align:right; cursor:pointer; line-height:1.25;}
  .brandsub .tname{display:block; color:var(--text); font-weight:700; text-transform:none; letter-spacing:.3px; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .brandsub .tdate{display:block; font-size:10px; color:var(--accent); letter-spacing:1px;}
  .menubtn{flex:0 0 auto; width:34px; height:34px; border-radius:10px; background:var(--panel); border:1px solid var(--line); color:var(--muted); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;}

  .athletes{display:flex; gap:8px; overflow-x:auto; padding:10px 14px 4px; max-width:680px; margin:0 auto; scrollbar-width:none;}
  .athletes::-webkit-scrollbar{display:none;}
  .ath{flex:0 0 auto; padding:8px 16px; border-radius:999px; cursor:pointer; background:var(--panel); border:1px solid var(--line); color:var(--muted); font-weight:700; font-size:14px; letter-spacing:.5px; white-space:nowrap; transition:.15s;}
  .ath.active{background:var(--text); color:#0c0d10; border-color:var(--text);}
  .ath.add{color:var(--accent); border-style:dashed; font-size:18px; padding:8px 15px;}

  .bwbar{display:flex; align-items:center; gap:8px; padding:12px 0 0;}
  .bwchip{display:flex; align-items:baseline; gap:7px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px 14px; cursor:pointer;}
  .bwchip .k{font-size:10.5px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted);}
  .bwchip .v{font-family:'Bebas Neue'; font-size:24px; letter-spacing:1px; color:var(--lime);}
  .bwchip .v.none{color:var(--dim);}
  .bwchip .u{font-size:12px; color:var(--dim);}

  .rank{background:var(--panel); border:1px solid var(--line); border-radius:18px; margin-top:14px; padding:14px 16px 16px;}
  .rankhead{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .rankhead .liftname{font-family:'Bebas Neue'; font-size:24px; letter-spacing:2px;}
  .rankhead .bar{display:inline-block; width:10px; height:20px; border-radius:3px; margin-right:9px; vertical-align:-3px; background:var(--blue);}
  .seg{display:flex; gap:6px; margin-bottom:10px;}
  .sgbtn{flex:1; padding:8px 4px; border-radius:9px; text-align:center; background:var(--panel2); border:1px solid var(--line); color:var(--muted); font-weight:700; font-size:12.5px; cursor:pointer;}
  .sgbtn.on{border-color:var(--blue); background:#41c7f71f; color:var(--blue);}
  .ptsrow{display:flex; gap:10px; margin:6px 0 4px;}
  .ptsbox{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:13px; padding:9px 12px;}
  .ptsbox .k{font-size:10px; text-transform:uppercase; letter-spacing:1.3px; color:var(--muted);}
  .ptsbox .v{font-family:'Bebas Neue'; font-size:33px; line-height:1; letter-spacing:1px;}
  .ptsbox.proj .v{color:var(--blue);} .ptsbox.made .v{color:var(--lime);} .ptsbox .v.none{color:var(--dim);}
  .target{margin-top:12px; border-top:1px solid var(--line); padding-top:12px;}
  .target .tlbl{font-size:11px; text-transform:uppercase; letter-spacing:1.3px; color:var(--muted); margin-bottom:8px;}
  .target .trow{display:flex; align-items:center; gap:10px;}
  .tinput{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:11px 12px; cursor:pointer;}
  .tinput .k{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
  .tinput .v{font-family:'Bebas Neue'; font-size:24px; letter-spacing:1px; color:var(--accent);} .tinput .v.none{color:var(--dim);}
  .tout{flex:1.4; text-align:right;}
  .tout .need{font-family:'Bebas Neue'; font-size:30px; letter-spacing:1px; color:var(--text); line-height:1;}
  .tout .need .u{font-family:'Saira'; font-size:12px; color:var(--dim); margin-left:3px;}

const LSKEY='pedana_v3', OLDKEY='pedana_v2';
function save(){ try{ store.curComp=comp.id; store.curAth=curAth; localStorage.setItem(LSKEY, JSON.stringify(store)); }catch(e){} }
function loadRaw(k){ try{ const s=localStorage.getItem(k); return s?JSON.parse(s):null; }catch(e){ return null; } }
const uid = () => 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function fmtDate(iso){ if(!iso) return ''; const p=String(iso).split('-'); return p.length===3 ? (p[2]+'/'+p[1]+'/'+p[0]) : iso; }

function normLift(l){
  l=l||{};
  if(!Array.isArray(l.attempts)) l.attempts=[[null,null,null],[null,null,null],[null,null,null]];
  l.attempts=[0,1,2].map(o=>{ const r=l.attempts[o]||[]; return [r[0]??null,r[1]??null,r[2]??null]; });
  if(!Array.isArray(l.warmup)) l.warmup=[];
  l.opt = (l.opt===0||l.opt===1||l.opt===2)? l.opt : 1;
  l.marks = Array.isArray(l.marks)? l.marks : [0,0,0];
  l.over  = Array.isArray(l.over) ? l.over  : [null,null,null];
  l.wuOpen = !!l.wuOpen;
  return l;
}
function normAth(a){
  a.id = a.id || uid();
  a.athleteId = a.athleteId || null;
  a.bw = (a.bw===undefined||a.bw==='')? null : a.bw;
  a.sex = (a.sex==='F')?'F':'M';
  a.oppTotal = (typeof a.oppTotal==='number')? a.oppTotal : null;
  a.oppBw = (typeof a.oppBw==='number')? a.oppBw : null;
  a.records = (a.records && typeof a.records==='object') ? a.records : {};
  ['squat','panca','stacco','total'].forEach(k=>{ if(typeof a.records[k]!=='number') a.records[k]=null; });
  LIFTS.forEach(L=> a[L.key]=normLift(a[L.key]));
  if(!a.name) a.name='ATLETA';
  return a;
}
function makeBlank(name){
  const a={id:uid(), athleteId:null, name:name||'ATLETA', bw:null, sex:'M', oppTotal:null, oppBw:null};
  LIFTS.forEach(L=>{ a[L.key]={attempts:[[null,null,null],[null,null,null],[null,null,null]], warmup:[]}; });
  return normAth(a);
}
function normProfile(p){
  p.id = p.id || uid();
  if(!p.name) p.name='ATLETA';
  p.sex = (p.sex==='F')?'F':'M';
  p.history = Array.isArray(p.history)? p.history : [];
  p.birth = p.birth || null;        // data di nascita ISO (per coeff. età)
  p.notes = typeof p.notes==='string' ? p.notes : '';
  return p;
}
function normComp(c){
  c.id = c.id || uid();
  if(!c.name) c.name='Gara';
  c.date = c.date || todayISO();
  c.fed = (c.fed==='FIPE') ? 'FIPE' : 'FIPL';
  c.settings = Object.assign({formula:'ipf', eq:false}, c.settings||{});
  c.settings.formula='ipf';   // FIPL e FIPE: sempre IPF GL (Goodlift)
  c.roster = (Array.isArray(c.roster) && c.roster.length) ? c.roster : [makeBlank('ATLETA 1')];
  c.roster.forEach(normAth);
  return c;
}

/* ---------- LOGICA ---------- */
function effWeights(a, liftKey){
  const l=a[liftKey];
  return l.attempts[l.opt].map((w,i)=> l.over[i]!==null ? l.over[i] : w);
}
function bestAttempt(a, liftKey){
  const arr=effWeights(a,liftKey);
  for(let i=arr.length-1;i>=0;i--) if(arr[i]!==null) return arr[i];
  return 0;
}
function madeAttempt(a, liftKey){
  const l=a[liftKey]; const arr=effWeights(a,liftKey);
  let best=null;
  arr.forEach((w,i)=>{ if(w!==null && l.marks[i]===1) best=best===null?w:Math.max(best,w); });
  return best;
}

/* ---------- COEFFICIENTI (DOTS + IPF GL) ---------- */
const COEF = {
  dots:{
    M:[-307.75076, 24.0900756, -0.1918759221, 0.0007391293, -0.000001093],
    F:[-57.96288, 13.6175032, -0.1126655495, 0.0005158568, -0.0000010706]
  },
  ipfRaw:{ M:[1199.72839,1025.18162,0.00921], F:[610.32796,1045.59282,0.03048] },
  ipfEq:{  M:[1236.25115,1449.21864,0.01644], F:[758.63878,949.31382,0.02435] }
};
function dotsCoef(bw, sex){ const c=COEF.dots[sex]; const d=c[0]+c[1]*bw+c[2]*bw*bw+c[3]*bw*bw*bw+c[4]*bw*bw*bw*bw; return 500/d; }
function ipfDen(bw, sex, eq){ const c=(eq?COEF.ipfEq:COEF.ipfRaw)[sex]; return c[0]-c[1]*Math.exp(-c[2]*bw); }
function pointsFor(total, a){
  const bw=a.bw; if(!bw||!total) return null;
  return settings.formula==='dots' ? total*dotsCoef(bw,a.sex) : total*100/ipfDen(bw,a.sex,settings.eq);
}
function totalForPoints(pts, a){
  const bw=a.bw; if(!bw||!pts) return null;
  return settings.formula==='dots' ? pts/dotsCoef(bw,a.sex) : pts*ipfDen(bw,a.sex,settings.eq)/100;
}
const round1 = n => (n===null||n===undefined)? null : Math.round(n*10)/10;

/* ---------- DISCHI (caricamento bilanciere) ---------- */
const PLATES = [
  {w:25, c:'#e53935'}, {w:20, c:'#1e88e5'}, {w:15, c:'#fdd835', t:'#222'},
  {w:10, c:'#43a047'}, {w:5, c:'#eceff1', t:'#222'}, {w:2.5, c:'#8e24aa'},
  {w:1.25, c:'#b0bec5', t:'#222'}, {w:0.5, c:'#90a4ae', t:'#222'}, {w:0.25, c:'#78909c', t:'#222'}
];
function plateBreakdown(weight){
  const bar=store.equip.bar, collar=store.equip.collar;
  if(weight===null||weight===undefined||isNaN(weight)) return {ok:false, reason:'no'};
  const base=bar+2*collar;
  if(weight < base) return {ok:false, reason:'low', base};
  let perSide=(weight-base)/2;
  perSide=Math.round(perSide*100)/100;
  const out=[]; let rem=perSide;
  PLATES.forEach(p=>{ while(rem >= p.w - 1e-6){ out.push(p); rem=Math.round((rem-p.w)*100)/100; } });
  return {ok:true, perSide, plates:out, remainder:Math.round(rem*100)/100, bar, collar};
}

/* ---------- COEFFICIENTI ETÀ (Foster giovani · McCulloch master) ---------- */
const FOSTER = {14:1.23,15:1.18,16:1.13,17:1.08,18:1.06,19:1.04,20:1.03,21:1.02,22:1.01,23:1.00};
const MCCULLOCH = {40:1.000,41:1.010,42:1.020,43:1.031,44:1.043,45:1.055,46:1.068,47:1.082,48:1.097,49:1.113,50:1.130,51:1.147,52:1.165,53:1.184,54:1.204,55:1.225,56:1.246,57:1.268,58:1.291,59:1.315,60:1.340,61:1.366,62:1.393,63:1.421,64:1.450,65:1.480,66:1.511,67:1.543,68:1.576,69:1.610,70:1.645,71:1.681,72:1.718,73:1.756,74:1.795,75:1.835,76:1.876,77:1.918,78:1.961,79:2.005,80:2.050,81:2.096,82:2.143,83:2.190,84:2.238,85:2.287,86:2.337,87:2.388,88:2.440,89:2.494,90:2.549};
function ageAt(birthISO, refISO){
  if(!birthISO) return null;
  const b=new Date(birthISO), r=new Date(refISO||todayISO());
  if(isNaN(b)||isNaN(r)) return null;
  let age=r.getFullYear()-b.getFullYear();
  const m=r.getMonth()-b.getMonth();
  if(m<0 || (m===0 && r.getDate()<b.getDate())) age--;
  return age;
}
function ageFactor(age){
  if(age===null||age===undefined) return {f:1, cat:null};
  if(age>=14 && age<=23) return {f:FOSTER[age], cat:'Junior'};
  if(age>=40){ const a=Math.min(age,90); return {f:MCCULLOCH[a], cat:'Master'}; }
  return {f:1, cat:null};
}
function profileOf(a){ return a.athleteId ? store.athletes.find(p=>p.id===a.athleteId) : null; }

  });
}

function renderRank(){
  const a=roster[curAth];
  const root=document.getElementById('rank'); root.innerHTML='';
  const card=document.createElement('div'); card.className='rank';
  const formulaName = comp.fed+' · IPF GL '+(settings.eq?'Equipped':'Classic');

  let proj=0, made=0, anyMade=false;
  LIFTS.forEach(l=>{ proj+=bestAttempt(a,l.key); const m=madeAttempt(a,l.key); if(m!==null){made+=m; anyMade=true;} });
  const baseTotal = anyMade? made : proj;
  const pProj=pointsFor(proj,a), pMade=anyMade?pointsFor(made,a):null;

  const head=document.createElement('div'); head.className='rankhead';
  head.innerHTML=`<div class="liftname"><span class="bar"></span>CLASSIFICA</div>`;
  card.appendChild(head);

  // ===== AVVERSARIO — sempre visibile =====
  const oppT=a.oppTotal, oppBw=a.oppBw;
  let required=null, mode='tot';
  if(oppT){
    if(oppBw && a.bw){
      const oppPts = settings.formula==='dots' ? oppT*dotsCoef(oppBw,a.sex) : oppT*100/ipfDen(oppBw,a.sex,settings.eq);
      required = totalForPoints(oppPts, a); mode='coef';
    } else { required = oppT; mode='tot'; }
  }
  let outHtml;
  if(required===null){
    outHtml=`<div class="rnote2">Inserisci il <b>totale dell'avversario</b> qui sopra (aggiornalo a ogni sua chiamata). Se è in un'altra categoria, aggiungi anche il suo <b>peso</b>.</div>`;
  } else {
    const diff=round1(required-baseTotal);
    const baseLab = anyMade?'fatto':'previsto';
    const status = diff<=0
      ? `<div class="bigstat ok">✓ SEI DAVANTI<span>margine di ${fmt(Math.abs(diff))} kg sul totale ${baseLab}</span></div>`
      : `<div class="bigstat no">TI MANCANO ${fmt(diff)} kg<span>sul totale ${baseLab}</span></div>`;
    let last='';
    const open=LIFTS.filter(l=>madeAttempt(a,l.key)===null);
    if(open.length===1){
      let madeOther=0; LIFTS.forEach(l=>{ if(l.key!==open[0].key){ const m=madeAttempt(a,l.key); if(m) madeOther+=m; }});
      last=`<div class="lastcall">Chiama su <b>${open[0].name}</b> almeno <b>${fmt(round1(required-madeOther))} kg</b> per superarlo.</div>`;
    }
    const modeLab = mode==='coef' ? 'a punti ('+formulaName+')' : 'per totale (stessa categoria)';
    outHtml=`<div class="needbig">Totale da battere: <b>${fmt(round1(required))}</b> kg <span style="font-size:11px;color:var(--dim)"> · ${modeLab}</span></div>${status}${last}`;
  }
  const opp=document.createElement('div');
  opp.innerHTML=`<div class="rsec">⚔️ Superare l'avversario</div>
    <div class="trow">
      <div class="tinput" id="oppTotIn"><div class="k">Totale avversario (kg)</div><div class="v ${oppT===null?'none':''}">${oppT===null?'tocca qui':fmt(oppT)}</div></div>
      <div class="tinput" id="oppBwIn"><div class="k">Peso avv. · solo altra cat.</div><div class="v ${oppBw===null?'none':''}">${oppBw===null?'—':fmt(oppBw)}</div></div>
    </div>
    <div class="oppout">${outHtml}</div>`;

  // ===== PUNTI A COEFFICIENTE (IPF GL) =====
  const segHtml = `<div class="seg">
      <div class="sgbtn ${!settings.eq?'on':''}" data-e="0">Classic / Raw</div>
      <div class="sgbtn ${settings.eq?'on':''}" data-e="1">Equipped</div>
    </div>`;
  const ptsBoxes = `<div class="ptsrow">
      <div class="ptsbox proj"><div class="k">Punti previsti</div><div class="v ${pProj===null?'none':''}">${pProj===null?'—':fmt(round1(pProj))}</div></div>
      <div class="ptsbox made"><div class="k">Punti fatti</div><div class="v ${pMade===null?'none':''}">${pMade===null?'—':fmt(round1(pMade))}</div></div>
    </div>`;
  const bwHint = a.bw ? '' : `<div class="rnote2" id="setbw">⚠️ Inserisci il <b>peso corporeo</b> (tocca qui) per calcolare i punti.</div>`;
  // punti età (Foster/McCulloch) se profilo ha data di nascita
  let ageHtml='';
  const prof=profileOf(a);
  const age = prof ? ageAt(prof.birth, comp.date) : null;
  const af = ageFactor(age);
  if(age!==null && af.cat && a.bw && (pProj!==null)){
    const apProj = pProj*af.f, apMade = pMade!==null? pMade*af.f : null;
    ageHtml=`<div class="agerow"><div class="agelbl">${af.cat} · ${age} anni · ×${af.f.toFixed(3)}</div>
      <div class="ptsrow">
        <div class="ptsbox proj"><div class="k">Punti età prev.</div><div class="v">${fmt(round1(apProj))}</div></div>
        <div class="ptsbox made"><div class="k">Punti età fatti</div><div class="v ${apMade===null?'none':''}">${apMade===null?'—':fmt(round1(apMade))}</div></div>
      </div></div>`;
  }
  // record totale
  let recTotHtml='';
  const pts=document.createElement('div');
  pts.innerHTML=`<div class="rsec">📊 Punti classifica — ${formulaName}</div>${segHtml}${ptsBoxes}${ageHtml}${recTotHtml}${bwHint}`;
  card.appendChild(pts);
  card.appendChild(opp);
  const sh=document.createElement('div'); sh.className='savehist'; sh.id='saveHistBtn'; sh.textContent='📌 Salva questo risultato nello storico';
  card.appendChild(sh);

  root.appendChild(card);

  sh.onclick=()=>saveToHistory(curAth, true);

  card.querySelector('#oppTotIn').onclick=()=>openNum({title:'Totale avversario', sub:'Il totale (kg) da superare — aggiornalo a ogni sua chiamata', value:a.oppTotal, clearLabel:'Cancella', onDone:v=>{ a.oppTotal=v; renderAll(); }});
  card.querySelector('#oppBwIn').onclick=()=>openNum({title:'Peso corporeo avversario', sub:"Solo se è in un'altra categoria (confronto a punti). Vuoto = stessa categoria.", value:a.oppBw, clearLabel:'Cancella', onDone:v=>{ a.oppBw=v; renderAll(); }});
  pts.querySelectorAll('.sgbtn').forEach(b=>{ b.onclick=()=>{ if(b.dataset.e!==undefined) settings.eq=(b.dataset.e==='1'); renderAll(); }; });
  const sb=pts.querySelector('#setbw'); if(sb) sb.onclick=()=>openNum({title:'Peso corporeo', sub:a.name+' · serve per i punti', value:a.bw, clearLabel:'Cancella', onDone:v=>{ a.bw=v; renderAll(); }});
}

/* ---------- EDITOR ATLETA ---------- */
let editIndex=null, draft=null;
const editorEl=document.getElementById('editor');
function openEditor(index){
  editIndex = (index===undefined || index===null) ? null : index;
  draft = editIndex===null ? makeBlank('') : JSON.parse(JSON.stringify(roster[editIndex]));
  normAth(draft);
  if(editIndex===null) draft.name='';
  renderEditor();
  editorEl.classList.add('show');
  window.scrollTo({top:0});
}
function closeEditor(){ editorEl.classList.remove('show'); editorEl.innerHTML=''; draft=null; }
function renderEditor(){
  const liftBlocks = LIFTS.map(L=>{
    const l=draft[L.key];
    let grid=`<div class="edgrid"><div class="edgh"></div><div class="edgh">OPZ 1</div><div class="edgh">OPZ 2</div><div class="edgh">OPZ 3</div>`;
    for(let r=0;r<3;r++){
      grid+=`<div class="edrh">${['1ª','2ª','3ª'][r]}</div>`;
      for(let o=0;o<3;o++){
        const v=l.attempts[o][r];
        grid+=`<input class="edin at" inputmode="decimal" data-l="${L.key}" data-o="${o}" data-r="${r}" value="${v===null?'':fmt(v)}" placeholder="—">`;
      }
    }
    grid+=`</div>`;
    let wu=`<div class="edwu"><div class="edwutitle">Riscaldamento</div>`;
    (l.warmup||[]).forEach((row,i)=>{
      wu+=`<div class="edwurow">
        <input class="edin wuw" inputmode="decimal" data-l="${L.key}" data-i="${i}" value="${(row.w===null||row.w===undefined)?'':fmt(row.w)}" placeholder="kg">
        <span class="mult">×</span>
        <input class="edin wur" type="text" data-l="${L.key}" data-i="${i}" value="${(row.r||'').toString().replace(/"/g,'&quot;')}" placeholder="rip. (es. 5 o 8×2)">
        <div class="del" data-l="${L.key}" data-i="${i}">×</div>
      </div>`;
    });
    wu+=`<div class="edadd" data-l="${L.key}">＋ Aggiungi riga</div></div>`;
    return `<div class="edlift"><div class="edliftname"><span class="bar" style="background:${L.color}"></span>${L.name}</div>${grid}${wu}</div>`;
  }).join('');

  editorEl.innerHTML=`
    <div class="edhead">
      <div class="b ghost" id="edCancel">Annulla</div>
      <div class="t">${editIndex===null?'Nuovo atleta':'Modifica atleta'}</div>
      <div class="b ok" id="edSave">Salva</div>
    </div>
    <div class="edbody">
      <div class="edrow"><div class="edlabel">Nome</div><input class="edtext" id="edName" type="text" value="${(draft.name||'').replace(/"/g,'&quot;')}" placeholder="Es. Luca"></div>
      <div class="edrow"><div class="edlabel">Sesso</div><div class="edsexrow">
        <div class="edsex ${draft.sex==='M'?'on':''}" data-sx="M">Maschile</div>
        <div class="edsex ${draft.sex==='F'?'on':''}" data-sx="F">Femminile</div>
      </div></div>
      <div class="edrow"><div class="edlabel">Peso corporeo (kg · opzionale)</div><input class="edtext" id="edBw" inputmode="decimal" value="${draft.bw===null?'':fmt(draft.bw)}" placeholder="—"></div>
      <div class="edhint">Le tre colonne sono le opzioni 1·2·3 (in forma / abbastanza / non in forma). Lascia vuote le caselle che non servono.</div>
      ${liftBlocks}
      <div class="edhint">Totali e punti si calcolano dall'ultima prova compilata di ogni opzione.</div>
    </div>`;

  editorEl.querySelector('#edCancel').onclick=closeEditor;
  editorEl.querySelector('#edSave').onclick=commitEditor;
  editorEl.querySelector('#edName').oninput=e=>{ draft.name=e.target.value; };
  editorEl.querySelector('#edBw').oninput=e=>{ const t=e.target.value.trim().replace(',','.'); draft.bw = t===''?null:(isNaN(parseFloat(t))?draft.bw:parseFloat(t)); };
  editorEl.querySelectorAll('.edsex').forEach(b=>b.onclick=()=>{ draft.sex=b.dataset.sx; renderEditor(); });
  editorEl.querySelectorAll('.edin.at').forEach(inp=>inp.oninput=()=>{
    const t=inp.value.trim().replace(',','.'); const v=t===''?null:(isNaN(parseFloat(t))?null:parseFloat(t));
    draft[inp.dataset.l].attempts[+inp.dataset.o][+inp.dataset.r]=v;
  });
  editorEl.querySelectorAll('.edin.wuw').forEach(inp=>inp.oninput=()=>{
    const t=inp.value.trim().replace(',','.'); const v=t===''?null:(isNaN(parseFloat(t))?null:parseFloat(t));
    draft[inp.dataset.l].warmup[+inp.dataset.i].w=v;
  });
  editorEl.querySelectorAll('.edin.wur').forEach(inp=>inp.oninput=()=>{ draft[inp.dataset.l].warmup[+inp.dataset.i].r=inp.value; });
  editorEl.querySelectorAll('.del').forEach(b=>b.onclick=()=>{ draft[b.dataset.l].warmup.splice(+b.dataset.i,1); renderEditor(); });
  editorEl.querySelectorAll('.edadd').forEach(b=>b.onclick=()=>{ draft[b.dataset.l].warmup.push({w:null,r:''}); renderEditor(); });
}
function commitEditor(){
  if(!draft.name || !draft.name.trim()) draft.name = editIndex===null ? ('ATLETA '+(roster.length+1)) : (roster[editIndex].name||'ATLETA');
  draft.name=draft.name.trim();
  LIFTS.forEach(L=>{ draft[L.key].warmup=(draft[L.key].warmup||[]).filter(r=> typeof r.w==='number' && !isNaN(r.w)); });
  normAth(draft);
  if(editIndex===null){ roster.push(draft); curAth=roster.length-1; }
  else { roster[editIndex]=draft; curAth=editIndex; }
  ensureProfile(draft); syncProfile(draft);
  closeEditor(); renderAll(); window.scrollTo({top:0});
}

function openPlates(weight, title){

      const chips = br.plates.length ? br.plates.map(p=>`<div class="plate" style="background:${p.c};color:${p.t||'#fff'}">${fmt(p.w)}</div>`).join('') : `<div class="pltxt" style="margin:0">solo bilanciere + collari</div>`;
      const txt = br.plates.length ? br.plates.map(p=>fmt(p.w)).join(' + ') : '—';
      inner = `<div class="plside">per lato · ${fmt(br.perSide)} kg</div><div class="plstack">${chips}</div>

    return `<div class="plbox">${inner}</div>`;
  }
  function draw(){
    sheet.innerHTML=`<h3>Caricamento bilanciere</h3><div class="sub">${title||''}</div>
      <input id="plIn" class="numval" inputmode="decimal" value="${wv===null?'':fmt(wv)}" placeholder="kg">

        <div class="step minus" data-d="-5">−5</div><div class="step minus" data-d="-2.5">−2.5</div><div class="step minus" data-d="-1.25">−1.25</div>
        <div class="step plus" data-d="1.25">+1.25</div><div class="step plus" data-d="2.5">+2.5</div><div class="step plus" data-d="5">+5</div>
      </div>
      ${body()}
      <div class="sheetbtns"><div class="sbtn ghost" id="plEquip">⚙️ Attrezzatura</div><div class="sbtn ok" id="plOk">Chiudi</div></div>`;
    const inp=sheet.querySelector('#plIn');
    inp.oninput=()=>{ const t=inp.value.trim().replace(',','.'); wv = t===''?null:(isNaN(parseFloat(t))?wv:parseFloat(t)); sheet.querySelector('.plbox').outerHTML=body(); };
    sheet.querySelectorAll('.step').forEach(s=>s.onclick=()=>{ let c=parseFloat((inp.value||'').replace(',','.')); if(isNaN(c))c=0; c=Math.round((c+parseFloat(s.dataset.d))*100)/100; if(c<0)c=0; wv=c; inp.value=fmt(c); sheet.querySelector('.plbox').outerHTML=body(); });
    sheet.querySelector('#plOk').onclick=closeSheet;
    sheet.querySelector('#plEquip').onclick=()=>openEquip(()=>draw());
  }
  draw(); ov.classList.add('show');
}

/* ---------- TIMER RISCALDAMENTO ---------- */
function openTimer(L){
  const a=roster[curAth];
  let sets=0; (a[L.key].warmup||[]).forEach(row=>{ if(a[L.key].opt===2 && ('opz3' in row) && row.opz3===null) return; sets++; });
  let n=3, sec=60; const minPerSet=150;
  let remaining=n*sec, running=false;
  function mmss(s){ s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  function draw(){
    const warmNeed=sets*minPerSet;
    const go = remaining<=warmNeed && remaining>0;
    sheet.innerHTML=`<h3>Timer riscaldamento — ${L.name}</h3><div class="sub">Quante alzate mancano prima del tuo atleta</div>
      <div class="recedit" id="tN"><span class="rk">Alzate prima di te</span><span class="rv">${n}</span></div>
      <div class="recedit" id="tS"><span class="rk">Secondi per alzata</span><span class="rv">${sec}s</span></div>
      <div class="tbig ${go?'go':''}" id="tBig">${mmss(remaining)}</div>
      <div class="tsub">stima tempo alla pedana</div>
      ${sets?`<div class="tstart">${go?'▶ INIZIA LA RAMPA ORA':'Rampa: '+sets+' serie · parti quando mancano '+mmss(warmNeed)}</div>`:`<div class="tstart" style="color:var(--dim)">Nessuna serie di riscaldamento impostata per questa opzione</div>`}
      <div class="steps">
        <div class="step" id="tReset">↺ reset</div>
        <div class="step plus" id="tRun" style="flex:2">${running?'⏸ Pausa':'▶ Avvia'}</div>
      </div>
      <div class="sheetbtns"><div class="sbtn ok" id="tClose">Chiudi</div></div>`;
    sheet.querySelector('#tN').onclick=()=>openNum({title:'Alzate prima di te', sub:'quante alzate mancano', value:n, onDone:v=>{ if(v!=null){n=Math.max(0,Math.round(v)); if(!running) remaining=n*sec;} draw(); }});
    sheet.querySelector('#tS').onclick=()=>openNum({title:'Secondi per alzata', sub:'di solito ~60s', value:sec, onDone:v=>{ if(v!=null){sec=Math.max(10,Math.round(v)); if(!running) remaining=n*sec;} draw(); }});
    sheet.querySelector('#tReset').onclick=()=>{ running=false; if(_timerInt){clearInterval(_timerInt);_timerInt=null;} remaining=n*sec; draw(); };
    sheet.querySelector('#tRun').onclick=()=>{ running=!running; if(running){ _timerInt=setInterval(()=>{ remaining--; if(remaining<=0){remaining=0; running=false; clearInterval(_timerInt); _timerInt=null;} const el=sheet.querySelector('#tBig'); if(el){ el.textContent=mmss(remaining); el.classList.toggle('go', remaining<=sets*minPerSet && remaining>0);} else { clearInterval(_timerInt); _timerInt=null; } }, 1000); } else { if(_timerInt){clearInterval(_timerInt);_timerInt=null;} } draw(); };
    sheet.querySelector('#tClose').onclick=closeSheet;
  }
  draw(); ov.classList.add('show');
}

  sheet.innerHTML=`<h3>Gestione</h3><div class="sub">${comp.name} · ${roster.length} atleti</div>
    <button class="menuitem" id="mComps">🏆 &nbsp;Gare — cambia / nuova</button>
    <button class="menuitem" id="mAnag">👤 &nbsp;Anagrafica atleti</button>
    <button class="menuitem" id="mSaveHist">📌 &nbsp;Salva risultato di “${a.name}” nello storico</button>
    <button class="menuitem" id="mPlates">🏋 &nbsp;Caricamento bilanciere</button>
    <div class="mdiv"></div>
    <button class="menuitem" id="mGuide">❓ &nbsp;Guida — come si usa</button>
    <button class="menuitem" id="mAdd">＋ &nbsp;Aggiungi atleta a questa gara</button>
    <button class="menuitem" id="mEdit">📝 &nbsp;Modifica piano di “${a.name}”</button>
    <button class="menuitem" id="mRename">✎ &nbsp;Rinomina “${a.name}”</button>
    <button class="menuitem danger" id="mDel">🗑 &nbsp;Togli “${a.name}” da questa gara</button>
    <button class="menuitem" id="mClear">⌫ &nbsp;Svuota lista di questa gara</button>
    <div class="sheetbtns"><div class="sbtn ghost" id="mClose">Chiudi</div></div>`;
  sheet.querySelector('#mClose').onclick=closeSheet;
  sheet.querySelector('#mComps').onclick=()=>{ closeSheet(); openComps(); };
  sheet.querySelector('#mAnag').onclick=()=>{ closeSheet(); openAnagrafica(); };
  sheet.querySelector('#mSaveHist').onclick=()=>{ closeSheet(); saveToHistory(curAth, true); };
  sheet.querySelector('#mPlates').onclick=()=>{ closeSheet(); openPlates(null, 'Calcolo libero'); };
  sheet.querySelector('#mGuide').onclick=()=>{ closeSheet(); openGuide(); };
  sheet.querySelector('#mAdd').onclick=()=>{ closeSheet(); openAddAthlete(); };
  sheet.querySelector('#mEdit').onclick=()=>{ closeSheet(); openEditor(curAth); };
  sheet.querySelector('#mRename').onclick=()=>{ closeSheet(); openText({title:'Rinomina atleta', value:a.name, onDone:n=>{ if(n){ a.name=n; syncProfile(a); renderAll(); } }}); };
  sheet.querySelector('#mDel').onclick=()=>{ closeSheet(); openConfirm('Togliere atleta dalla gara?', '“'+a.name+'” verrà rimosso da questa gara. Lo storico personale resta in anagrafica.', 'Togli', ()=>removeAthlete(curAth)); };
  sheet.querySelector('#mClear').onclick=()=>{ closeSheet(); openConfirm('Svuotare la lista?', 'Resta un atleta vuoto da compilare. Le modifiche di questa gara andranno perse.', 'Svuota', ()=>{ roster.length=0; roster.push(makeBlank('ATLETA 1')); curAth=0; renderAll(); }); };
  ov.classList.add('show');
}

/* ---------- GARE ---------- */
function switchComp(id){ store.curComp=id; curAth=0; setActiveComp(); renderAll(); window.scrollTo({top:0}); }
function openComps(){
  sheet.classList.add('tall');
  let rows = store.comps.map(c=>{
    const active = c.id===comp.id;
    return `<button class="menuitem complist${active?' on':''}" data-id="${c.id}">
      <span class="cmain">${active?'✓ ':''}${c.name} <span style="color:var(--accent);font-weight:700">· ${c.fed}</span></span><span class="cdate">${fmtDate(c.date)} · ${c.roster.length} atleti · ${c.settings.eq?'Equipped':'Classic'}</span></button>`;
  }).join('');
  sheet.innerHTML=`<h3>Gare</h3><div class="sub">${store.comps.length} gare salvate · tocca per aprire</div>
    ${rows}
    <div class="mdiv"></div>
    <button class="menuitem" id="cNew">＋ &nbsp;Nuova gara</button>
    <button class="menuitem" id="cFed">🏳 &nbsp;Federazione gara attiva: ${comp.fed}</button>
    <button class="menuitem" id="cDiv">🏋 &nbsp;Divisione: ${comp.settings.eq?'Equipped':'Classic'}</button>
    <button class="menuitem" id="cRen">✎ &nbsp;Rinomina gara attiva</button>
    <button class="menuitem" id="cDate">📅 &nbsp;Data gara attiva</button>
    <button class="menuitem danger" id="cDel">🗑 &nbsp;Elimina gara attiva</button>
    <div class="sheetbtns"><div class="sbtn ghost" id="cClose">Chiudi</div></div>`;
  sheet.querySelectorAll('.complist').forEach(b=>b.onclick=()=>{ closeSheet(); switchComp(b.dataset.id); });
  sheet.querySelector('#cClose').onclick=closeSheet;
  sheet.querySelector('#cNew').onclick=()=>{ closeSheet(); openNewComp(); };
  sheet.querySelector('#cFed').onclick=()=>{ comp.fed = comp.fed==='FIPL'?'FIPE':'FIPL'; save(); openComps(); };
  sheet.querySelector('#cDiv').onclick=()=>{ comp.settings.eq = !comp.settings.eq; save(); openComps(); };
  sheet.querySelector('#cRen').onclick=()=>{ closeSheet(); openText({title:'Rinomina gara', value:comp.name, onDone:n=>{ if(n){ comp.name=n; team=n; renderAll(); } }}); };
  sheet.querySelector('#cDate').onclick=()=>{ closeSheet(); openDate(comp.date, v=>{ comp.date=v||comp.date; renderAll(); }); };
  sheet.querySelector('#cDel').onclick=()=>{ closeSheet(); openConfirm('Eliminare questa gara?', '“'+comp.name+'” e i suoi dati verranno eliminati. Lo storico personale degli atleti resta in anagrafica.', 'Elimina', ()=>{
    store.comps = store.comps.filter(c=>c.id!==comp.id);
    if(!store.comps.length){ const c=normComp({name:'Gara 1', date:todayISO(), fed:'FIPL', roster:[makeBlank('ATLETA 1')]}); store.comps.push(c); }
    store.curComp=store.comps[0].id; curAth=0; setActiveComp(); renderAll();
  }); };
  ov.classList.add('show');
}
function openNewComp(){
  let name='', fed='FIPL', eq=false;
  function draw(){
    sheet.innerHTML=`<h3>Nuova gara</h3><div class="sub">Nome, federazione e divisione</div>
      <input id="ncName" class="tin" type="text" value="${name.replace(/"/g,'&quot;')}" placeholder="Es. Regionali 2026">
      <div class="edlabel" style="margin:4px 0 6px">Federazione</div>
      <div class="edsexrow" style="margin-bottom:12px">
        <div class="edsex ${fed==='FIPL'?'on':''}" data-fed="FIPL">FIPL</div>
        <div class="edsex ${fed==='FIPE'?'on':''}" data-fed="FIPE">FIPE</div>
      </div>
      <div class="edlabel" style="margin:4px 0 6px">Divisione</div>
      <div class="edsexrow" style="margin-bottom:4px">
        <div class="edsex ${!eq?'on':''}" data-div="0">Classic / Raw</div>
        <div class="edsex ${eq?'on':''}" data-div="1">Equipped</div>
      </div>
      <div class="edhint">Entrambe usano il punteggio IPF GL (Goodlift) e i coefficienti età IPF.</div>
      <div class="sheetbtns"><div class="sbtn ghost" id="ncCancel">Annulla</div><div class="sbtn ok" id="ncOk">Crea gara</div></div>`;
    sheet.querySelector('#ncName').oninput=e=>{ name=e.target.value; };
    sheet.querySelectorAll('[data-fed]').forEach(b=>b.onclick=()=>{ fed=b.dataset.fed; draw(); });
    sheet.querySelectorAll('[data-div]').forEach(b=>b.onclick=()=>{ eq=b.dataset.div==='1'; draw(); });
    sheet.querySelector('#ncCancel').onclick=closeSheet;
    sheet.querySelector('#ncOk').onclick=()=>{
      const c=normComp({name:name.trim()||('Gara '+(store.comps.length+1)), date:todayISO(), fed:fed, settings:{formula:'ipf',eq:eq}, roster:[makeBlank('ATLETA 1')]});
      store.comps.push(c); closeSheet(); switchComp(c.id);
    };
  }
  draw(); ov.classList.add('show');
}
function openDate(cur, onDone){
  sheet.innerHTML=`<h3>Data gara</h3><div class="sub">Scegli la data della competizione</div>
    <input id="dIn" class="tin" type="date" value="${cur||todayISO()}">
    <div class="sheetbtns"><div class="sbtn ghost" id="dCancel">Annulla</div><div class="sbtn ok" id="dOk">OK</div></div>`;
  sheet.querySelector('#dCancel').onclick=closeSheet;
  sheet.querySelector('#dOk').onclick=()=>{ const v=sheet.querySelector('#dIn').value; closeSheet(); onDone(v); };
  ov.classList.add('show');
}

/* ---------- ANAGRAFICA & STORICO ---------- */
function syncProfile(a){
  if(!a.athleteId) return;
  const p=store.athletes.find(x=>x.id===a.athleteId);
  if(p){ p.name=a.name; p.sex=a.sex; }
}
function ensureProfile(a){
  if(a.athleteId){ const p=store.athletes.find(x=>x.id===a.athleteId); if(p) return p; }
  const p=normProfile({name:a.name, sex:a.sex}); store.athletes.push(p); a.athleteId=p.id; return p;
}
function saveToHistory(i, announce){
  const a=roster[i];
  const p=ensureProfile(a);
  let proj=0, made=0, anyMade=false; const bestLifts={};
  LIFTS.forEach(l=>{ proj+=bestAttempt(a,l.key); const m=madeAttempt(a,l.key); bestLifts[l.key]=m; if(m!==null){made+=m; anyMade=true;} });
  const total = anyMade? made : proj;
  const pts = pointsFor(total, a);
  const rec = { compId:comp.id, compName:comp.name, date:comp.date, bw:a.bw,
    formula:comp.settings.formula, eq:comp.settings.eq,
    total:round1(total), done:anyMade, points:round1(pts),
    squat:bestLifts.squat, panca:bestLifts.panca, stacco:bestLifts.stacco };
  p.history = p.history.filter(h=>h.compId!==comp.id);
  p.history.push(rec);
  p.history.sort((x,y)=> (y.date||'').localeCompare(x.date||''));
  save();
  if(announce) openInfo('Salvato nello storico', '“'+a.name+'” · '+comp.name+': totale '+fmt(round1(total))+' kg'+(pts?(' · '+fmt(round1(pts))+' pt'):'')+(anyMade?' (fatto)':' (previsto)')+'.');
}
function openInfo(title, msg){
  sheet.innerHTML=`<h3>${title}</h3><div class="sub">${msg}</div><div class="sheetbtns"><div class="sbtn ok" id="iOk">OK</div></div>`;
  sheet.querySelector('#iOk').onclick=closeSheet; ov.classList.add('show');
}
function openAnagrafica(){
  sheet.classList.add('tall');
  let rows = store.athletes.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>{
    const inComp = roster.some(e=>e.athleteId===p.id);
    return `<button class="menuitem complist" data-id="${p.id}">
      <span class="cmain">${p.name} <span style="color:var(--dim);font-weight:400">· ${p.sex}</span></span>
      <span class="cdate">${p.history.length} gare in storico${inComp?' · in questa gara':''}</span></button>`;
  }).join('') || `<div class="sub" style="padding:6px 2px">Nessun atleta in anagrafica.</div>`;
  sheet.innerHTML=`<h3>Anagrafica atleti</h3><div class="sub">${store.athletes.length} atleti · tocca per lo storico</div>
    ${rows}
    <div class="mdiv"></div>
    <button class="menuitem" id="aNew">＋ &nbsp;Nuovo atleta in anagrafica</button>
    <div class="sheetbtns"><div class="sbtn ghost" id="aClose">Chiudi</div></div>`;
  sheet.querySelectorAll('.complist').forEach(b=>b.onclick=()=>{ closeSheet(); openProfile(b.dataset.id); });
  sheet.querySelector('#aClose').onclick=closeSheet;
  sheet.querySelector('#aNew').onclick=()=>{ closeSheet(); openText({title:'Nuovo atleta', sub:'Nome · verrà aggiunto solo in anagrafica', placeholder:'Es. Luca', onDone:n=>{ if(n){ store.athletes.push(normProfile({name:n, sex:'M'})); save(); openAnagrafica(); } }}); };
  ov.classList.add('show');
}
function openProfile(id){
  const p=store.athletes.find(x=>x.id===id); if(!p){ openAnagrafica(); return; }
  sheet.classList.add('tall');
  let hist = p.history.length ? p.history.map(h=>{
    const f = h.formula==='dots'?'DOTS':('IPF '+(h.eq?'Eq':'Cl'));
    const parts=[]; if(h.squat!=null)parts.push('S '+fmt(h.squat)); if(h.panca!=null)parts.push('P '+fmt(h.panca)); if(h.stacco!=null)parts.push('St '+fmt(h.stacco));
    return `<div class="hrec">
      <div class="htop"><span class="hcomp">${h.compName}</span><span class="hdate">${fmtDate(h.date)}</span></div>
      <div class="hmid"><span class="htot">${fmt(h.total)}<span class="u">kg</span></span>
        <span class="hpts">${h.points!=null?fmt(h.points)+' pt':''}</span>
        <span class="hbw">${h.bw!=null?fmt(h.bw)+' kg bw · ':''}${f}${h.done?'':' · prev.'}</span></div>
      ${parts.length?`<div class="hlifts">${parts.join('  ·  ')}</div>`:''}</div>`;
  }).join('') : `<div class="sub" style="padding:6px 2px">Nessuna gara nello storico. Usa “Salva risultato nello storico” dal menu durante una gara.</div>`;
  const best = p.history.reduce((m,h)=> (h.points!=null && (m===null||h.points>m))?h.points:m, null);
  const agN = ageAt(p.birth, todayISO());
  const agf = ageFactor(agN);
  const ageTxt = p.birth ? (agN+' anni'+(agf.cat?' · '+agf.cat+' ×'+agf.f.toFixed(3):' · Open')) : 'non impostata';
  sheet.innerHTML=`<h3>${p.name}</h3><div class="sub">${p.sex==='M'?'Maschile':'Femminile'} · ${p.history.length} gare${best!=null?' · best '+fmt(best)+' pt':''}</div>
    <div class="hwrap">${hist}</div>
    <div class="mdiv"></div>
    <button class="menuitem" id="pAdd">➕ &nbsp;Aggiungi a “${comp.name}”</button>
    <button class="menuitem" id="pBirth">🎂 &nbsp;Data di nascita: ${p.birth?fmtDate(p.birth):'—'} <span style="color:var(--dim);font-weight:400">(${ageTxt})</span></button>
    <button class="menuitem" id="pNote">📝 &nbsp;Nota tecnica</button>
    <button class="menuitem" id="pRen">✎ &nbsp;Rinomina</button>
    <button class="menuitem" id="pSex">⚥ &nbsp;Sesso: ${p.sex==='M'?'Maschile':'Femminile'}</button>
    <button class="menuitem danger" id="pDel">🗑 &nbsp;Elimina dall'anagrafica</button>
    <div class="sheetbtns"><div class="sbtn ghost" id="pBack">Indietro</div></div>`;
  sheet.querySelector('#pBack').onclick=()=>{ closeSheet(); openAnagrafica(); };
  sheet.querySelector('#pAdd').onclick=()=>{
    if(roster.some(e=>e.athleteId===p.id)){ closeSheet(); openInfo('Già presente', '“'+p.name+'” è già in questa gara.'); return; }
    const e=makeBlank(p.name); e.sex=p.sex; e.athleteId=p.id; roster.push(e); curAth=roster.length-1; closeSheet(); renderAll(); window.scrollTo({top:0});
  };
  sheet.querySelector('#pBirth').onclick=()=>openDate(p.birth||'2000-01-01', v=>{ p.birth=v||p.birth; save(); openProfile(id); renderAll(); });
  sheet.querySelector('#pNote').onclick=()=>openTextArea({title:'Nota tecnica', sub:p.name+' · cue, comandi, promemoria', value:p.notes, onDone:v=>{ p.notes=v; save(); openProfile(id); renderAll(); }});
  sheet.querySelector('#pRen').onclick=()=>{ openText({title:'Rinomina atleta', value:p.name, onDone:n=>{ if(n){ p.name=n; roster.forEach(e=>{ if(e.athleteId===p.id) e.name=n; }); save(); openProfile(id); renderAll(); } }}); };
  sheet.querySelector('#pSex').onclick=()=>{ p.sex=p.sex==='M'?'F':'M'; roster.forEach(e=>{ if(e.athleteId===p.id) e.sex=p.sex; }); save(); openProfile(id); renderAll(); };
  sheet.querySelector('#pDel').onclick=()=>{ openConfirm('Eliminare dall\'anagrafica?', '“'+p.name+'” e il suo storico verranno eliminati. Gli atleti già inseriti nelle gare restano.', 'Elimina', ()=>{ store.athletes=store.athletes.filter(x=>x.id!==id); roster.forEach(e=>{ if(e.athleteId===id) e.athleteId=null; }); save(); openAnagrafica(); }); };
  ov.classList.add('show');
}
function openAddAthlete(){
  const avail = store.athletes.filter(p=>!roster.some(e=>e.athleteId===p.id)).sort((a,b)=>a.name.localeCompare(b.name));
  let rows = avail.map(p=>`<button class="menuitem complist" data-id="${p.id}"><span class="cmain">${p.name} <span style="color:var(--dim);font-weight:400">· ${p.sex}</span></span><span class="cdate">dall'anagrafica · ${p.history.length} gare</span></button>`).join('');
  sheet.classList.add('tall');
  sheet.innerHTML=`<h3>Aggiungi atleta</h3><div class="sub">Crea nuovo o scegli dall'anagrafica</div>
    <button class="menuitem" id="nNew">＋ &nbsp;Nuovo atleta (compila il piano)</button>
    ${rows?`<div class="mdiv"></div><div class="sub" style="padding:2px 2px 8px">Dall'anagrafica</div>${rows}`:''}
    <div class="sheetbtns"><div class="sbtn ghost" id="nClose">Chiudi</div></div>`;
  sheet.querySelector('#nClose').onclick=closeSheet;
  sheet.querySelector('#nNew').onclick=()=>{ closeSheet(); openEditor(null); };
  sheet.querySelectorAll('.complist').forEach(b=>b.onclick=()=>{
    const p=store.athletes.find(x=>x.id===b.dataset.id);
    const e=makeBlank(p.name); e.sex=p.sex; e.athleteId=p.id; roster.push(e); curAth=roster.length-1; closeSheet(); renderAll(); window.scrollTo({top:0});
  });
  ov.classList.add('show');
}

function openGuide(){
  sheet.classList.add('tall');
  sheet.innerHTML=`<h3>Guida — come si usa</h3>
  <div class="guide">
    <h4>Atleti</h4>
    <p>In alto scorri e tocca un atleta per selezionarlo. <b>＋</b> in fondo alla lista aggiunge un atleta nuovo (parte vuoto, lo compili tu toccando i pesi).</p>
    <h4>Peso corporeo e sesso</h4>
    <p>Tocca <b>Peso corporeo</b> per inserirlo e <b>Sesso</b> (M/F) per cambiarlo: servono per i punti a coefficiente della classifica.</p>
    <h4>Opzioni 1 · 2 · 3</h4>
    <p><b>OPZ 1</b> = atleta in forma, <b>OPZ 2</b> = abbastanza, <b>OPZ 3</b> = non in forma. "Imposta tutte le alzate" le mette tutte sulla stessa opzione in un tocco; poi puoi cambiarle una per una.</p>
    <h4>Le alzate</h4>
    <p>Per ogni alzata scegli l'opzione e vedi le 3 prove. <b>Tocca una prova</b> per segnarla ✓ valida → ✗ nulla → neutra. Tocca <b>✎</b> per scrivere l'<b>alzata reale</b> quando chiami un peso fuori dalla previsione (funziona anche su una prova vuota).</p>
    <h4>Riscaldamento</h4>
    <p>Si apre toccando "Riscaldamento". Con OPZ 3 i pesi condizionati si adattano da soli (in arancione).</p>
    <h4>Totali</h4>
    <p><b>Previsto</b> = somma delle ultime prove delle opzioni scelte. <b>Fatto</b> = somma delle migliori alzate segnate come valide.</p>
    <h4>Classifica e punti</h4>
    <p>Punteggio <b>IPF GL (Goodlift)</b>, usato sia da FIPL che da FIPE. Scegli la divisione <b>Classic</b> o <b>Equipped</b>. Vedi punti previsti e fatti su peso e sesso.</p>
    <h4>Federazione della gara</h4>
    <p>Alla creazione scegli <b>FIPL</b> o <b>FIPE</b>: entrambe usano regolamento IPF, punteggio IPF GL e coefficienti età IPF. La puoi cambiare dal menu Gare.</p>
    <h4>Coefficienti età (Master / Junior)</h4>
    <p>Imposta la <b>data di nascita</b> nel profilo (Anagrafica). Se l'atleta è Junior (14–23) o Master (40+), in classifica compaiono i <b>punti età</b> con il coefficiente IPF (Foster / McCulloch).</p>
    <h4>Caricamento bilanciere (dischi)</h4>
    <p>Tocca il peso <b>previsto</b> di un'alzata, o una riga di riscaldamento, per vedere <b>quali dischi</b> mettere per lato. Dal menu “Caricamento bilanciere” fai un calcolo libero. In Attrezzatura imposti bilanciere e collari (IPF: 20 + 2,5).</p>
    <h4>Timer riscaldamento</h4>
    <p>Il tasto <b>⏱</b> su un'alzata: inserisci quante alzate mancano prima del tuo atleta, parte un conto alla rovescia alla pedana e ti dice <b>quando iniziare la rampa</b>.</p>
    <h4>Nota tecnica</h4>
    <p>Sotto peso e sesso c'è la <b>nota</b> dell'atleta (cue, comandi): resta salvata nel suo profilo, gara dopo gara.</p>
    <h4>Superare l'avversario</h4>
    <p>Inserisci il <b>Totale avversario</b> aggiornandolo a ogni sua chiamata. Se è nella <b>tua stessa categoria</b> lascia vuoto il peso: vince chi fa più totale e il tool ti dice quanto ti serve. Se è in <b>un'altra categoria</b> (best lifter) metti anche il suo <b>peso</b>: il confronto passa ai punti. Se hai già chiuso due alzate, ti dice quanto <b>chiamare sull'ultima</b> per stargli davanti.</p>
    <h4>Gare</h4>
    <p>Tocca il nome della gara in alto a destra (o <b>menu ⋯ → Gare</b>) per cambiare gara, crearne una nuova, rinominarla o impostarne la data. Ogni gara tiene i suoi atleti, le sue impostazioni e la sua classifica, salvati nel tempo.</p>
    <h4>Anagrafica atleti</h4>
    <p><b>Menu ⋯ → Anagrafica</b>: l'elenco di tutti i tuoi atleti con il loro <b>storico personale</b> (ogni gara con totale, punti e alzate). Da un profilo puoi aggiungere l'atleta alla gara attiva. Quando crei un atleta, il suo profilo nasce da solo.</p>
    <h4>Salvare un risultato nello storico</h4>
    <p>A fine gara, col pulsante <b>📌 Salva nello storico</b> (in fondo alla classifica o nel menu) registri totale e punti dell'atleta nel suo profilo. Risalvando la stessa gara, il dato si aggiorna.</p>
    <h4>Gestione (menu ⋯)</h4>
    <p>Aggiungi, modifica, rinomina o togli un atleta dalla gara, gestisci gare e anagrafica.</p>
    <h4>Salvataggio</h4>
    <p>Tutto si salva <b>sul tuo telefono</b>. I dati non sono condivisi: ogni coach ha i propri atleti, gare e storici.</p>
  </div>
  <div class="sheetbtns"><div class="sbtn ok" id="gClose">Ho capito</div></div>`;
  sheet.querySelector('#gClose').onclick=closeSheet;
  ov.classList.add('show');
}

document.getElementById('menuBtn').onclick=openMenu;
document.getElementById('teamLbl').onclick=openComps;
document.getElementById('resetBtn').onclick=()=>{
  const a=roster[curAth];
  LIFTS.forEach(l=>{ a[l.key].marks=[0,0,0]; a[l.key].over=[null,null,null]; });
  renderAll();
};

renderAll();
</script>
